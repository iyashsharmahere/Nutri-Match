name: CI
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r backend/requirements-dev.txt -c backend/constraints.txt
      - run: cd backend && python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package.json }
      - run: pip install -r backend/requirements.txt -c backend/constraints.txt
      - run: cd backend && (RATE_LIMIT_PER_MIN=0 python -m uvicorn main:app --port 8000 &) && sleep 6
      - run: cd frontend && npm install && npm run lint && npm test && npm run build
      - name: Real-browser checks (plant position and growth, dial, skyline clicks)
        run: |
          cd frontend
          (npx vite preview --port 4173 --host 127.0.0.1 &) && sleep 3
          CHROME_PATH="$(which google-chrome)" npm run e2e
